_ > nanoagent.plugin.v0001.ManifestConfig:
id: degree-audit-checker
name: Degree Audit Checker
version: 0.2.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  get_catalog:
    description: Get the degree program's requirements, each with its kind, what it needs, its minimum grade and the courses that count toward it, plus the credits needed to graduate and the grade order
  get_transcript:
    description: Get the student's transcript (every attempt) and its summary, each course that may count toward a requirement with its best grade, credits and the requirements it qualifies for, and the passed credits
  place_courses:
    description: Apply every course to a requirement, each shared course where the placements say and the rest to their one requirement, save the audit this gives to the workspace, and return it with how many requirements it satisfies
  pin_audit:
    description: Pin the most requirements any legal placement of the student's courses satisfies and one audit that does, the task's answer key

# One entry per contract.Task; its input class is contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  audit-degree:
    description: Audit a student's transcript against a degree program, placing each course toward at most one requirement so that as many requirements as possible are satisfied, and say what is missing and whether the student can graduate
    runner: agent
    tools: [get_catalog, get_transcript, place_courses]
    reference: pin_audit
    instructions: |-
      Plan. One step each: (1) get_catalog and get_transcript together, both with the task input copied exactly; (2) place_courses with your placements; (3) submit with the audit place_courses returned, exactly as returned. If place_courses satisfies fewer requirements than you expected, you may call it once more with a better placement before submitting.
      What the tools settle. get_transcript's courses already apply every grade rule (best attempt, F and W, P meeting only D-, minimum grades): counts_toward lists the requirements each course may count toward. place_courses applies each course and works out what is satisfied and missing, the total credits and graduation.
      Requirements. all: every listed course is needed. choose: `needed` courses. credits: courses whose credits add up to `needed`.
      Your decision. Each course counts toward exactly one requirement. Choose, for every course with two or more requirements in counts_toward, which one it goes to, so that as many requirements as possible are satisfied; the other courses go to their one requirement on their own. Put a shared course where it completes a requirement that cannot be completed otherwise; use the rest to fill credit requirements.
      Brevity. Do not restate the catalog or transcript. Think only about the shared courses and the requirements they touch, one short line each, then call place_courses.
